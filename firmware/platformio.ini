; ============================================================================
;  PlatformIO — Passerelle ESP32 du tapis roulant (Conveyor AI Ops)
; ============================================================================
;  Compilation en ligne de commande (équivalent au sketch Arduino IDE) :
;
;      pio run                       # compile
;      pio run -t upload             # téléverse sur la carte (port USB)
;      pio device monitor -b 115200   # moniteur série
;
;  Le même fichier `esp32_conveyor.ino` se compile aussi directement dans
;  l'IDE Arduino (carte « ESP32 Dev Module ») : aucune dépendance exotique.
; ============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Vitesse d'horloge et mémoire : la FFT 512 points + les 5 tâches tiennent
; largement dans les 320 Ko de RAM utile de l'ESP32.
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.partitions = default.csv
monitor_speed = 115200
upload_speed = 921600

; Bibliothèques (mêmes versions que celles validées sur banc)
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
    https://github.com/kosme/arduinoFFT.git#v2.0.1

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -Wall

; Options de compilation utiles pour la mise au point :
;   -DCORE_DEBUG_LEVEL=5   → journal détaillé du cœur ESP32
;   -Wall                  → avertissements stricts (le sketch se compile sans erreur)
;   -O2                    → optimisations par défaut
