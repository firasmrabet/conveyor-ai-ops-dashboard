# =============================================================================
#  Broker MQTT — Conveyor AI Ops
#  Écoute 1883 (MQTT), 9001 (MQTT over WebSocket), TLS optionnel sur 8883.
# =============================================================================

# --- Identité du broker ------------------------------------------------------
per_listener_settings true

# --- Journalisation ----------------------------------------------------------
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# --- Persistance -------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

# --- Écouteur MQTT standard (réseau Docker interne + poste de développement) --
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl

# --- Écouteur MQTT over WebSocket (outils de diagnostic type MQTT Explorer) ---
listener 9001 0.0.0.0
protocol websockets
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/config/acl

# --- Écouteur MQTT over TLS (production : décommenter après avoir créé les
#     certificats avec mosquitto/certs/generate-certs.sh) -----------------------
# listener 8883 0.0.0.0
# protocol mqtt
# cafile   /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile  /mosquitto/certs/server.key
# require_certificate false
# tls_version tlsv1.2
# allow_anonymous false
# password_file /mosquitto/data/passwd
# acl_file /mosquitto/config/acl

# --- Limites de sécurité -----------------------------------------------------
max_connections 200
max_keepalive 120
message_size_limit 262144
max_inflight_messages 20
max_queued_messages 1000
